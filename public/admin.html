<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Management</title>
    <link id="theme-stylesheet" rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleAdmin.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header>
        <button id="back-button" onclick="location.href='index.html'">Back to Control Panel</button>
        <div class="account-container">
            <button id="account-button">Account</button>
            <div id="account-dropdown" class="account-dropdown hidden">
                <button id="manage-account-button">Manage Account</button>
                <button id="admin-management-button" class="hidden">Admin Management</button>
                <button id="appearance-button">Appearance</button>
                <div id="appearance-panel" class="appearance-panel hidden">
                    <div class="appearance-row">
                        <span>Classic</span>
                        <label class="switch">
                            <input type="checkbox" id="appearance-classic-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="appearance-label">Color Mode</div>
                    <label class="appearance-option">
                        <input type="radio" name="appearance-color" value="system">
                        System
                    </label>
                    <label class="appearance-option">
                        <input type="radio" name="appearance-color" value="light">
                        Light
                    </label>
                    <label class="appearance-option">
                        <input type="radio" name="appearance-color" value="dark">
                        Dark
                    </label>
                </div>
                <button id="logout-button">Logout</button>
            </div>
        </div>
    </header>

    <main>
        <h1>Admin Management</h1>

        <section class="create-user">
            <h2>Create User</h2>
            <form id="create-user-form">
                <label for="new-username">Username</label>
                <input type="text" id="new-username" required>
                <button type="submit">Create User</button>
                <div id="create-message" class="create-message"></div>
            </form>
        </section>

        <section class="users-list">
            <div class="section-header">
                <h2>Users</h2>
                <button id="audit-log-button" type="button">Audit Log</button>
            </div>
            <div class="table-wrapper">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Temp Password</th>
                            <th>Last Login</th>
                            <th>Last Password Reset</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </div>
        </section>

        <section class="update-history">
            <div class="section-header">
                <h2>Server Update History</h2>
                <button id="refresh-update-history-button" type="button">Refresh History</button>
            </div>
            <div class="table-wrapper">
                <table id="update-history-table">
                    <thead>
                        <tr>
                            <th>Started</th>
                            <th>Actor</th>
                            <th>Version Path</th>
                            <th>Mode</th>
                            <th>Status</th>
                            <th>Mods Updated</th>
                            <th>Mods Not Updated</th>
                            <th>Summary</th>
                        </tr>
                    </thead>
                    <tbody id="update-history-table-body"></tbody>
                </table>
            </div>
            <div id="update-history-empty" class="empty-state hidden">No update history runs recorded yet.</div>
        </section>
    </main>

    <div id="update-summary-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close-update-summary="true"></div>
        <div class="modal-content update-summary-modal-content" role="dialog" aria-modal="true" aria-labelledby="update-summary-title">
            <h2 id="update-summary-title">Update Summary</h2>
            <div id="update-summary-content" class="update-summary-content"></div>
            <div class="modal-actions update-summary-actions">
                <button id="update-summary-close-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="appearance.js"></script>
    <script src="admin.js"></script>
</body>
</html>
