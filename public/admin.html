<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Management</title>
    <link rel="stylesheet" href="styleAdmin.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header>
        <button id="back-button" onclick="location.href='index.html'">Back to Control Panel</button>
        <div class="account-container">
            <button id="account-button">Account</button>
            <div id="account-dropdown" class="account-dropdown hidden">
                <button id="reset-password-button">Reset Password</button>
                <button id="logout-button">Logout</button>
            </div>
        </div>
    </header>

    <main>
        <h1>Admin Management</h1>

        <section class="create-user">
            <h2>Create User</h2>
            <form id="create-user-form">
                <label for="new-username">Username</label>
                <input type="text" id="new-username" required>
                <button type="submit">Create User</button>
                <div id="create-message" class="create-message"></div>
            </form>
        </section>

        <section class="users-list">
            <div class="section-header">
                <h2>Users</h2>
                <button id="audit-log-button" type="button">Audit Log</button>
            </div>
            <div class="table-wrapper">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Temp Password</th>
                            <th>Last Login</th>
                            <th>Last Password Reset</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="password-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <h3>Reset Password</h3>
            <label for="current-password">Current Password</label>
            <input type="password" id="current-password" required>
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" required>
            <label for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password" required>
            <div class="modal-actions">
                <button id="cancel-reset" type="button">Cancel</button>
                <button id="confirm-reset" type="button">Update Password</button>
            </div>
            <p id="password-message" class="modal-message"></p>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
