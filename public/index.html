<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Server Control Panel</title>
    <link id="theme-stylesheet" rel="stylesheet" href="style.css?v=20260402-17">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="control-panel">
    <header>
        <div class="account-container">
            <button id="account-button">Account</button>
            <div id="account-dropdown" class="account-dropdown hidden">
                <button id="manage-account-button">Manage Account</button>
                <button id="admin-management-button" class="hidden">Admin Management</button>
                <button id="appearance-button">Appearance</button>
                <div id="appearance-panel" class="appearance-panel hidden">
                    <div class="appearance-row">
                        <span>Classic</span>
                        <label class="switch">
                            <input type="checkbox" id="appearance-classic-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="appearance-label">Color Mode</div>
                    <label class="appearance-option">
                        <input type="radio" name="appearance-color" value="system">
                        System
                    </label>
                    <label class="appearance-option">
                        <input type="radio" name="appearance-color" value="light">
                        Light
                    </label>
                    <label class="appearance-option">
                        <input type="radio" name="appearance-color" value="dark">
                        Dark
                    </label>
                </div>
                <button id="logout-button">Logout</button>
            </div>
        </div>
        <button id="sftp-button"   class="sftp-button" onclick="location.href='sftp.html'">Server Backups Browser</button>
    </header>
    <div class="content">
        <h1>Creative Server Control Panel</h1>
        <button id="start-server">Start Server</button>
        <button id="restart-server">Restart Server</button>
        <button id="stop-server">Stop Server</button>
        <button id="backup-server">Backup Server</button>
        <button id="update-server" class="hidden">Update Available</button>
        <div id="update-status-message" class="update-status-message hidden"></div>
        <div id="progress-area">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-percentage">0%</div>
        </div>
    </div>

    <div id="update-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close-update-modal="true"></div>
        <div class="modal-content update-modal-content" role="dialog" aria-modal="true" aria-labelledby="update-modal-title">
            <h2 id="update-modal-title">Server Update</h2>
            <p id="update-modal-summary" class="modal-message"></p>
            <div id="update-mod-warning" class="update-mod-warning hidden"></div>
            <div id="update-java-warning" class="update-java-warning hidden"></div>
            <div id="update-conflicts" class="update-conflicts hidden">
                <h3>Incompatible or Unknown Mods</h3>
                <ul id="update-conflict-list"></ul>
            </div>
            <div class="modal-actions update-modal-actions">
                <button id="update-cancel-btn">Cancel</button>
                <button id="update-compatible-btn">Update Server and Only Compatible Mods</button>
                <button id="update-server-only-btn">Update Server Only and Delete All Mods</button>
                <button id="update-compatible-version-btn" class="hidden">Update Compatible Version</button>
            </div>
        </div>
    </div>

    <div id="update-summary-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close-update-summary="true"></div>
        <div class="modal-content update-summary-modal-content" role="dialog" aria-modal="true" aria-labelledby="update-summary-title">
            <h2 id="update-summary-title">Update Summary</h2>
            <div id="update-summary-content" class="update-summary-content"></div>
            <div class="modal-actions update-summary-actions">
                <button id="update-summary-close-btn">Close</button>
            </div>
        </div>
    </div>
    <script src="appearance.js?v=20260402-17"></script>
    <script src="script.js?v=20260402-17"></script>
</body>
</html>
