<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>USE Servers Control Hub</title>
    <link id="theme-stylesheet" rel="stylesheet" href="style.css?v=20260505-10">
    <link rel="stylesheet" href="servers.css?v=20260930-11">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>
<body class="server-overview">
    <header class="overview-header">
        <span class="overview-brand"><img class="overview-logo" src="/assets/server-tiles/creative.png" alt="" width="38" height="38"> USE Servers</span>
        <div class="overview-account-actions">
            <div class="account-container">
                <button id="account-button"
                        type="button"
                        aria-controls="account-dropdown"
                        aria-expanded="false">Account</button>
                <div id="account-dropdown" class="account-dropdown hidden" aria-hidden="true">
                    <button id="manage-account-button">Manage Account</button>
                    <button id="admin-management-button" class="hidden">Admin Management</button>
                    <button id="appearance-button">Appearance</button>
                    <div id="appearance-panel" class="appearance-panel hidden">
                        <div class="appearance-row">
                            <span>Classic</span>
                            <label class="switch">
                                <input type="checkbox" id="appearance-classic-toggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="appearance-label">Color Mode</div>
                        <label class="appearance-option">
                            <input type="radio" name="appearance-color" value="system">
                            System
                        </label>
                        <label class="appearance-option">
                            <input type="radio" name="appearance-color" value="light">
                            Light
                        </label>
                        <label class="appearance-option">
                            <input type="radio" name="appearance-color" value="dark">
                            Dark
                        </label>
                    </div>
                    <div id="overview-advanced" class="overview-advanced hidden">
                        <button id="overview-advanced-button" type="button" aria-expanded="false" aria-controls="overview-advanced-panel">Advanced</button>
                        <div id="overview-advanced-panel" class="hidden">
                            <label class="overview-manual-refresh">
                                <input type="checkbox" id="manual-refresh-toggle" role="switch">
                                Manual refresh
                            </label>
                        </div>
                    </div>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
            <button id="refresh-servers" class="overview-refresh hidden" type="button">Refresh</button>
        </div>
    </header>
    <main class="overview-main">
        <div class="overview-intro">
            <h1>USE Servers Control Hub</h1>
        </div>
        <div class="overview-toolbar">
            <p id="server-slots" role="status">Checking shared server slots…</p>
        </div>
        <div id="overview-notice" class="overview-notice hidden" role="status"></div>
        <div id="server-tiles" class="server-tiles" aria-label="Available servers" aria-busy="true">
            <p class="overview-empty">Loading your servers…</p>
        </div>
    </main>
    <script src="serverContext.js"></script>
    <script src="appearance.js?v=20260930-2"></script>
    <script src="servers.js?v=20260930-5"></script>
</body>
</html>
