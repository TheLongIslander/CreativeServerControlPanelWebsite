<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Password</title>
    <link rel="stylesheet" href="styleLogin.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h2>Set Your Password</h2>
    <form id="set-password-form">
        <p>Password must be at least 12 characters and not a common password.</p>
        <label for="password">New Password:</label>
        <input type="password" id="password" required>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" required>
        <button type="submit">Update Password</button>
        <p id="message"></p>
    </form>

    <div id="passkey-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" role="document">
            <h3>Set up a passkey?</h3>
            <p>Passkeys let you sign in with Face ID, Touch ID, or a security key.</p>
            <div class="modal-actions">
                <button id="passkey-skip" type="button" class="secondary-button">Not now</button>
                <button id="passkey-accept" type="button">Set up passkey</button>
            </div>
        </div>
    </div>

    <script src="webauthn.js"></script>
    <script src="set-password.js"></script>
</body>
</html>
