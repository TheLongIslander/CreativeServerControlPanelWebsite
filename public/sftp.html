<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Creative Server Backup File Browser</title>
    <link rel="stylesheet" href="styleSFTP.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header>
        <input type="text" id="path-input" placeholder="Enter path here..." value="/">
        <button id="go-button" onclick="changeDirectory()">Go</button>
        <button id="create-directory-button">Create Directory</button>
        <button id="up-directory-button" onclick="upDirectory()">Up Directory</button>
        <button id="control-panel" onclick="location.href='index.html'">Control Panel</button>
        <div class="account-container">
            <button id="account-button">Account</button>
            <div id="account-dropdown" class="account-dropdown hidden">
                <button id="reset-password-button">Reset Password</button>
                <button id="admin-management-button" class="hidden">Admin Management</button>
                <button id="logout-button">Logout</button>
            </div>
        </div>
    </header>
    <div class="content">
        <h1 onclick="goToRoot()">The Creative Server Backup File Browser</h1>
        <ul id="file-list"></ul>
    </div>
    <div class="upload-section">
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" style="display:none;" multiple>
            <button type="button" id="upload-button">Upload</button>
            <div id="progress-container" style="display:none;">
                <progress id="upload-progress" value="0" max="100" style="width: 80%;"></progress>
                <div id="upload-percentage" style="text-align:center; margin-top:5px;"></div>
            </div>
        </form>
    </div>
    <div id="loading-spinner" class="spinner" style="display:none;"></div>
    <div id="password-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <h3>Reset Password</h3>
            <label for="current-password">Current Password</label>
            <input type="password" id="current-password" required>
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" required>
            <label for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password" required>
            <div class="modal-actions">
                <button id="cancel-reset" type="button">Cancel</button>
                <button id="confirm-reset" type="button">Update Password</button>
            </div>
            <p id="password-message" class="modal-message"></p>
        </div>
    </div>
    <script src="sftp.js"></script>
</body>
</html>
