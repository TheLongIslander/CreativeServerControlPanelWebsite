<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <title>Server Backup Files</title>
    <link id="theme-stylesheet" rel="stylesheet" href="style.css?v=20261001-1">
    <link rel="stylesheet" href="textEffects.css?v=20260930-1">
    <link rel="stylesheet" href="styleSFTP.css?v=20261001-2">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header class="sftp-toolbar">
        <div class="toolbar-actions">
            <button id="control-panel" type="button" onclick="location.href=window.ServerContext.panelUrl()" aria-label="Back to Control Panel">
                <span class="toolbar-label-full">Control Panel</span><span class="toolbar-label-compact" aria-hidden="true">← Panel</span>
            </button>
            <button id="create-directory-button" type="button" aria-label="Create directory">
                <span class="toolbar-label-full">Create Directory</span><span class="toolbar-label-compact" aria-hidden="true">New folder</span>
            </button>
            <div class="account-container">
                <button id="account-button">Account</button>
                <div id="account-dropdown" class="account-dropdown hidden">
                    <button id="manage-account-button">Manage Account</button>
                    <button id="admin-management-button" class="hidden">Admin Management</button>
                    <button id="appearance-button">Appearance</button>
                    <div id="appearance-panel" class="appearance-panel hidden">
                        <div class="appearance-row">
                            <span>Classic</span>
                            <label class="switch">
                                <input type="checkbox" id="appearance-classic-toggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="appearance-label">Color Mode</div>
                        <label class="appearance-option">
                            <input type="radio" name="appearance-color" value="system">
                            System
                        </label>
                        <label class="appearance-option">
                            <input type="radio" name="appearance-color" value="light">
                            Light
                        </label>
                        <label class="appearance-option">
                            <input type="radio" name="appearance-color" value="dark">
                            Dark
                        </label>
                        <fieldset id="appearance-server-tile-controls" class="appearance-group" hidden>
                            <legend class="appearance-label">Server Tile</legend>
                            <label class="appearance-option">
                                <input type="radio" name="appearance-server-tile" value="dynamic">
                                Dynamic
                            </label>
                            <label class="appearance-option">
                                <input type="radio" name="appearance-server-tile" value="still">
                                Still
                            </label>
                        </fieldset>
                    </div>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
        <div class="path-navigation">
            <button id="up-directory-button" type="button" onclick="upDirectory()" aria-label="Up one directory" title="Up one directory">
                <span class="toolbar-label-full">Up Directory</span><span class="toolbar-label-compact" aria-hidden="true">↑</span>
            </button>
            <div class="path-input-shell">
                <input type="text" id="path-input" aria-label="Directory path" placeholder="Enter path here..." value="/" autocomplete="off" spellcheck="false">
            </div>
            <button id="go-button" onclick="changeDirectory()">Go</button>
        </div>
    </header>
    <div class="content">
        <h1 onclick="goToRoot()">Server Backup Files</h1>
        <p id="sftp-state" role="status" hidden></p>
        <ul id="file-list"></ul>
    </div>
    <div class="upload-section">
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" style="display:none;" multiple>
            <button type="button" id="upload-button">Upload</button>
            <div id="progress-container" style="display:none;">
                <progress id="upload-progress" value="0" max="100"></progress>
                <div id="upload-percentage" style="text-align:center; margin-top:5px;"></div>
            </div>
        </form>
    </div>
    <div id="loading-spinner" class="spinner" style="display:none;"></div>
    <script src="textEffects.js?v=20260930-1"></script>
    <script src="appearance.js?v=20261001-1"></script>
    <script src="serverContext.js?v=permissions-1"></script>
    <script src="sftp.js?v=permissions-1"></script>
</body>
</html>
